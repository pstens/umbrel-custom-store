version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparkles-deal-alerts_alerts_1
      APP_PORT: 8080

  # Local yes/no model that judges Telegram posts (github.com/feder-cr/jev, MIT, ~1 GB RAM, CPU only).
  jev:
    image: docker.io/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
    platform: linux/amd64
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      JEV_THREADS: ${JEV_THREADS:-2}
    command:
      - python
      - -u
      - -c
      - |
        import hashlib, os, tarfile, urllib.request, zipfile

        RELEASE = "https://github.com/feder-cr/jev/releases/download/jevos-v5/"
        FILES = {"jev-linux-x64.tar.gz": "1ce77566405514ed2f20d64f8222cf9eba9b714d332f05f6296e0cad84dd7b04",
                 "jevos-v5-openvino-int8.zip": "0a1159c31b9c2abc484af9c866cdcfe5279fdf592b368636625c5a795f970acc"}
        D = "/data/jev"
        if not os.path.exists(D + "/jevos-v5.ready"):
            os.makedirs(D, exist_ok=True)
            for name, sha in FILES.items():
                path = D + "/" + name
                print("downloading " + name)
                urllib.request.urlretrieve(RELEASE + name, path)
                h = hashlib.sha256()
                with open(path, "rb") as f:
                    for chunk in iter(lambda: f.read(1 << 20), b""):
                        h.update(chunk)
                if h.hexdigest() != sha:
                    raise SystemExit("checksum mismatch for " + name)
                if name.endswith(".zip"):
                    zipfile.ZipFile(path).extractall(D)
                else:
                    tarfile.open(path).extractall(D, filter="data")
                os.remove(path)
            open(D + "/jevos-v5.ready", "w").close()
        # --warmup 0: by default jev precompiles 384 prompt lengths in the background, which kept its threads
        # busy (2 full cores) while idle. Without it a new prompt length compiles on first use instead.
        os.execv(D + "/jev/jev", [D + "/jev/jev", "serve", "--host", "0.0.0.0", "--port", "8017", "--warmup", "0",
                                  "--model-dir", D + "/model", "--threads", os.environ.get("JEV_THREADS") or "2"])

  alerts:
    image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      HOME: /data
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      RETOURA_URL: ${RETOURA_URL:-https://shop.retoura.de/Maschinen-Geraete,https://shop.retoura.de/Akkus-Ladegeraete,https://shop.retoura.de/Handwerkzeuge,https://shop.retoura.de/Grossmaschinen,https://shop.retoura.de/Werkstatteinrichtung,https://shop.retoura.de/Arbeitskleidung-Schutz,https://shop.retoura.de/Malerzubehoer,https://shop.retoura.de/Sicherheitstechnik}
      RETOURA_INTERVAL_MIN: ${RETOURA_INTERVAL_MIN:-30}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_GROUPS: ${TG_GROUPS:-}
      TG_TOPIC: ${TG_TOPIC:-}
    # The script lives here rather than in a file because umbrelOS does not
    # copy plain files into the app data directory on app updates.
    command:
      - python
      - -u
      - -c
      - |
        import asyncio, datetime, html, http.server, importlib, json, os, re, subprocess, sys, threading, time, urllib.parse, urllib.request

        sys.path.insert(0, "/data/py")
        try:
            import telethon, tzdata
        except ImportError:
            # ponytail: installed once into the data volume; delete /data/py to upgrade.
            subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "--no-cache-dir",
                                   "--target", "/data/py", "telethon<2", "tzdata"])
            importlib.invalidate_caches()
            import telethon
        from telethon import TelegramClient, events, errors
        from zoneinfo import ZoneInfo

        E = os.environ.get
        BOT = E("BOT_TOKEN", "")
        SHOPS = [u.strip().split("?")[0].rstrip("/") for u in E("RETOURA_URL", "").split(",") if u.strip()]
        EVERY = int(E("RETOURA_INTERVAL_MIN") or 30) * 60
        # Each entry: part of a group name, @username, chat ID, or a t.me / web.telegram.org link to the group.
        GROUPS = [re.split(r"[/#]", g.strip().lower())[-1].lstrip("@") for g in E("TG_GROUPS", "").split(",") if g.strip()]
        # German example words per category: jev is trained on English and judged German posts poorly without them
        # (37/40 right on a German test set, against 31/40 with the bare English list).
        TOPIC = E("TG_TOPIC") or (
            "power tools (Bohrhammer, Akkuschrauber, Säge, Schleifer), hand tools (Hammer, Zange, Schraubendreher), "
            "machines (Kompressor, Rüttelplatte), measuring devices (Laser, Wasserwaage, Entfernungsmesser), "
            "ladders (Leiter, Gerüst), work clothing (Arbeitshose, Arbeitsjacke, Sicherheitsschuhe), "
            "safety gear (Arbeitshandschuhe, Schutzbrille, Gehörschutz), work lights (Baustrahler, Arbeitsleuchte), "
            "cables (Kabeltrommel, Verlängerungskabel) or batteries for tools")
        # Keywords, discount and threshold are set by messaging the bot and kept here.
        STATE_FILE = "/data/state.json"
        STATE = json.load(open(STATE_FILE)) if os.path.exists(STATE_FILE) else {}
        STATE.setdefault("sent", {})
        STATE.setdefault("watch", [])
        STATE.setdefault("min_discount", 60)
        STATE.setdefault("threshold", 0.92)
        if STATE.get("jev_question") != 3:
            # Version 2 moved to the tradesman question; 3 raises the threshold, because 0.8 passed coffee machines and pyjamas.
            STATE.update(jev_question=3, threshold=0.92)
        STATE.setdefault("quiet", [22, 7])
        TZ = ZoneInfo(E("TZ") or "Europe/Berlin")
        if E("CHAT_ID"):
            STATE["chat_id"] = int(E("CHAT_ID"))
        LOCK = threading.RLock()
        LOG, LOGIN, LOOP = [], {}, None
        TG = TelegramClient("/data/telegram", int(E("TG_API_ID")), E("TG_API_HASH")) if E("TG_API_ID") and E("TG_API_HASH") else None

        def log(msg):
            line = datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%d %H:%M UTC  ") + msg
            print(line)
            LOG.append(line)
            del LOG[:-300]

        def save():
            with LOCK:
                with open(STATE_FILE + ".tmp", "w") as f:
                    json.dump(STATE, f)
                os.replace(STATE_FILE + ".tmp", STATE_FILE)

        def bot(method, upload=None, **params):
            url = "https://api.telegram.org/bot%s/%s" % (BOT, method)
            if upload is None:
                req = urllib.request.Request(url, json.dumps(params).encode(), {"Content-Type": "application/json"})
            else:
                # upload = (field, jpeg bytes), sent as multipart/form-data
                b = "dealalerts%d" % time.time_ns()
                parts = ['--%s\r\nContent-Disposition: form-data; name="%s"\r\n\r\n%s\r\n' % (b, k, v) for k, v in params.items()]
                body = ("".join(parts) + '--%s\r\nContent-Disposition: form-data; name="%s"; filename="photo.jpg"\r\n'
                        "Content-Type: image/jpeg\r\n\r\n" % (b, upload[0])).encode() + upload[1] + ("\r\n--%s--\r\n" % b).encode()
                req = urllib.request.Request(url, body, {"Content-Type": "multipart/form-data; boundary=" + b})
            with urllib.request.urlopen(req, timeout=70) as r:
                return json.load(r)["result"]

        def quiet_now():
            if not STATE["quiet"]:
                return False
            start, end = STATE["quiet"]
            h = datetime.datetime.now(TZ).hour
            return start <= h or h < end if start > end else start <= h < end

        def notify(text, photo=None):
            """photo: an image URL or JPEG bytes. Falls back to a text message if the photo is refused."""
            if not BOT:
                return log("BOT_TOKEN is not set, would send: " + text)
            cid = STATE.get("chat_id")
            if not cid:
                return log("no chat yet: send /start to your bot")
            common = {"chat_id": cid, "parse_mode": "HTML", "disable_notification": quiet_now()}
            # Telegram captions stop at 1024 characters; longer texts go without a photo.
            if photo and len(text) <= 1024:
                try:
                    if isinstance(photo, bytes):
                        bot("sendPhoto", upload=("photo", photo), caption=text, **{k: str(v).lower() if isinstance(v, bool) else v for k, v in common.items()})
                    else:
                        bot("sendPhoto", photo=photo, caption=text, **common)
                    return True
                except Exception as e:
                    log("photo refused, sending text: %r" % e)
            bot("sendMessage", text=text, **common)
            return True

        # ---------- retoura ----------
        def parse(page):
            for card in page.split('class="p-w col-12"')[1:]:
                m = re.search(r'href="([^"]+)" class="title[^"]*"><span\s+class="ret-article-name">([^<]*)</span>(?:<span>([^<]*)</span>)?', card)
                price = re.search(r'itemprop="price" content="([\d.]+)"', card)
                if not (m and price):
                    continue
                disc = re.search(r'class="ov-t[^"]*">- (\d+)%', card)
                old = re.search(r'old-price-value">([^<]+)<', card)
                img = re.search(r'<img\s+src="([^"]+)"', card)
                yield {"url": m[1], "name": html.unescape(m[2]).strip(), "grade": (m[3] or "").strip(),
                       "img": img[1].replace("/sm/", "/md/") if img else None,
                       "price": float(price[1]), "old": old[1].strip() if old else "",
                       "discount": int(disc[1]) if disc else 0}

        def fetch(shop, n):
            url = shop + ("" if n == 1 else "_s%d" % n) + "?Sortierung=99"
            req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=60) as r:
                return r.read().decode("utf-8", "replace")

        def check_retoura(min_disc=None):
            """min_disc overrides the saved minimum discount for this one check (/check 30)."""
            if not (BOT and STATE.get("chat_id")):
                return log("retoura: waiting for BOT_TOKEN and /start")
            min_disc = STATE["min_discount"] if min_disc is None else min_disc
            hits = sum(check_shop(shop, min_disc) for shop in SHOPS)
            msg = "retoura: %d new deal(s) in %d categor%s" % (hits, len(SHOPS), "y" if len(SHOPS) == 1 else "ies")
            log(msg)
            return msg

        def check_shop(shop, min_disc):
            hits, watch = 0, list(STATE["watch"])
            # Sortierung=99 lists the highest discount first, so stop at the first item below the threshold.
            for n in range(1, 50):
                items = list(parse(fetch(shop, n)))
                for it in items:
                    if it["discount"] < min_disc:
                        return hits
                    if watch and not any(w in it["name"].lower() for w in watch):
                        continue
                    seen = STATE["sent"].get(it["url"])
                    if seen is not None and seen <= it["price"]:
                        continue
                    # Mark a deal only once Telegram has it, so a failed send is retried next time.
                    if not notify("🛒 <b>%s</b> %s\n<b>%.2f €</b> statt %s (−%d%%)\n%s" % (
                        html.escape(it["name"]), html.escape(it["grade"]), it["price"],
                        html.escape(it["old"]), it["discount"], html.escape(it["url"])), it["img"]):
                        continue
                    with LOCK:
                        STATE["sent"][it["url"]] = it["price"]
                        save()
                    hits += 1
                if len(items) < 20:
                    break
            return hits

        async def retoura_loop():
            while True:
                try:
                    await asyncio.to_thread(check_retoura)
                except Exception as e:
                    log("retoura error: %r" % e)
                await asyncio.sleep(EVERY)

        # ---------- bot commands ----------
        HELP = ("/add Bohrhammer, Makita – watch words in retoura names and group posts\n"
                "/del Makita – stop watching a word\n"
                "/discount 60 – minimum retoura discount in percent\n"
                "/threshold 0.92 – jev score (0–1) for group posts without a watched word\n"
                "/quiet 22 7 – no sound from 22:00 to 7:00; /quiet off\n"
                "/check – check retoura now; /check 30 checks once from 30% off\n"
                "/reset – forget which retoura deals were sent, so /check sends them again\n"
                "/list – show the settings")

        def settings():
            return "Words: %s\nRetoura: from %d%% off, every %d min\nGroups: a watched word or jev ≥ %.2f\nSilent: %s" % (
                ", ".join(STATE["watch"]) or "none, so every retoura item counts",
                STATE["min_discount"], EVERY // 60, STATE["threshold"],
                "%02d:00–%02d:00" % tuple(STATE["quiet"]) if STATE["quiet"] else "never")

        def command(text):
            cmd, _, arg = text.strip().partition(" ")
            cmd = cmd.split("@")[0].lower()
            words = [w.strip().lower() for w in arg.split(",") if w.strip()]
            with LOCK:
                if cmd == "/add" and words:
                    STATE["watch"] += [w for w in words if w not in STATE["watch"]]
                elif cmd == "/del" and words:
                    STATE["watch"] = [w for w in STATE["watch"] if w not in words]
                elif cmd == "/discount" and arg.strip().isdigit() and int(arg) <= 100:
                    STATE["min_discount"] = int(arg)
                elif cmd == "/threshold" and re.fullmatch(r"0?\.\d+|0|1", arg.strip()):
                    STATE["threshold"] = float(arg)
                elif cmd == "/quiet" and (arg.strip() == "off" or re.fullmatch(r"\d{1,2} \d{1,2}", arg.strip())):
                    hours = [int(h) for h in arg.split()] if arg.strip() != "off" else []
                    if any(h > 23 for h in hours):
                        return HELP
                    STATE["quiet"] = hours
                elif cmd == "/reset":
                    n = len(STATE["sent"])
                    STATE["sent"] = {}
                    save()
                    return "Forgot %d sent retoura deal(s). /check sends every match again." % n
                elif cmd == "/check" and (not arg.strip() or arg.strip().isdigit() and int(arg) <= 100):
                    once = int(arg) if arg.strip() else None
                    threading.Thread(target=lambda: notify(check_retoura(once)), daemon=True).start()
                    return "Checking retoura%s…" % (" once from %d%% off" % once if once is not None else "")
                elif cmd == "/list":
                    return settings()
                else:
                    return HELP + "\n\n" + settings()
                save()
            return "OK.\n" + settings()

        COMMANDS = [("add", "Watch words, e.g. /add bohrhammer, säge"), ("del", "Stop watching words"),
                    ("discount", "Minimum retoura discount, e.g. /discount 40"),
                    ("threshold", "jev score for group posts, e.g. /threshold 0.92"),
                    ("quiet", "Silent hours, e.g. /quiet 22 7 or /quiet off"),
                    ("check", "Check retoura now, e.g. /check 30 for once from 30% off"),
                    ("reset", "Forget sent retoura deals so /check sends them again"), ("list", "Show the settings")]

        def bot_loop():
            offset = None
            try:
                # Shows the commands in Telegram's / menu.
                bot("setMyCommands", commands=[{"command": c, "description": d} for c, d in COMMANDS])
            except Exception as e:
                log("bot: could not set the command menu: %r" % e)
            while True:
                try:
                    for u in bot("getUpdates", offset=offset, timeout=50, allowed_updates=["message"]):
                        offset = u["update_id"] + 1
                        m = u.get("message") or {}
                        cid = m.get("chat", {}).get("id")
                        # The first chat that writes to the bot owns it; everyone else is ignored.
                        with LOCK:
                            if not STATE.get("chat_id") and cid:
                                STATE["chat_id"] = cid
                                save()
                                log("bot: alerts go to chat %s" % cid)
                        if cid == STATE["chat_id"] and m.get("text") and not m.get("forward_origin"):
                            # One command per line, so several can go in one message.
                            replies = [command(l) for l in m["text"].splitlines() if l.strip()]
                            bot("sendMessage", chat_id=cid, text=replies[-1] if replies else HELP)
                except Exception as e:
                    log("bot error: %r" % e)
                    time.sleep(10)

        # ---------- telegram groups ----------
        # "power tools (Bohrhammer, …)" -> name "power tools", description with the examples
        CATEGORIES = {re.sub(r"\s*\(.*?\)", "", c).strip(): c.strip() for c in re.split(r",(?![^()]*\))| or (?![^()]*\))", TOPIC) if c.strip()}
        CATEGORIES["none of these"] = "anything else, such as clothing for everyday use, household or beauty products"

        def classify(text):
            """jev (sibling service) reads the post once and answers both questions: P(useful) and the closest category."""
            body = {"model": "jev-latest", "state": text, "questions": {
                "useful": {"type": "noul", "instructions":
                    "Would a tradesman on a construction site use the product in this German post at work? "
                    "Examples: " + TOPIC + ". Everyday clothing, household, beauty, toys and electronics do not count."},
                "category": {"type": "choice", "instructions": "Which kind of product does this post offer?",
                             "criteria": CATEGORIES}}}
            req = urllib.request.Request("http://jev:8017/v1/systemone", json.dumps(body).encode(),
                                         {"Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=60) as r:
                a = json.load(r)["answers"]
            return a["useful"]["noul"], a["category"]["choice"]

        async def on_message(ev):
            if ev.is_private:
                return
            chat = await ev.get_chat()
            title = getattr(chat, "title", "") or ""
            keys = {(getattr(chat, "username", "") or "").lower(), str(chat.id), "-%d" % chat.id, "-100%d" % chat.id}
            if GROUPS and not any(g in keys or g in title.lower() for g in GROUPS):
                return
            msg = ev.message
            links = re.findall(r"https?://\S+", msg.message or "")
            links += [e.url for e in (msg.entities or []) if getattr(e, "url", None)]
            links += [b.url for row in (msg.buttons or []) for b in row if getattr(b, "url", None)]
            links = list(dict.fromkeys(links))
            # Only posts with a link can be bought from.
            if not links or not msg.message:
                STATS["nolink"] += 1
                return
            # Deal channels repost the same deal; the repost costs no jev call and sends no second alert.
            if seen_before(links, msg.message):
                STATS["duplicates"] += 1
                return
            # A watched word is enough and goes out at once; jev judges the rest, one post at a time.
            why = next((w for w in STATE["watch"] if w in msg.message.lower()), None)
            if why:
                return await deliver(chat, title, msg, links, why)
            JEV_QUEUE.put_nowait((chat, title, msg, links))

        def link_key(url):
            """Amazon links by product number, so different link variants of one product match; others as written."""
            u = url.lower().split("?")[0].rstrip("/")
            asin = re.search(r"/(?:dp|gp/product|gp/aw/d)/([a-z0-9]{10})", u)
            return "asin:" + asin[1] if asin else u

        SEEN = {}  # ponytail: in memory, so a restart forgets the last 24 h of posts; persist it if reposts after restarts annoy
        STATS = {"duplicates": 0, "jev": 0, "nolink": 0}

        def seen_before(links, text):
            now = time.time()
            for k in [k for k, t in SEEN.items() if now - t > 86400]:
                del SEEN[k]
            keys = {link_key(l) for l in links} | {"text:" + re.sub(r"https?://\S+|\W+", "", text.lower())[:200]}
            dup = any(k in SEEN for k in keys)
            SEEN.update(dict.fromkeys(keys, now))
            return dup

        JEV_QUEUE = asyncio.Queue()

        async def jev_worker():
            # One jev call at a time: a burst of posts waits here instead of loading the CPU in parallel.
            last_report = time.time()
            while True:
                chat, title, msg, links = await JEV_QUEUE.get()
                try:
                    p, kind = await asyncio.to_thread(classify, msg.message)
                    STATS["jev"] += 1
                    if p >= STATE["threshold"]:
                        await deliver(chat, title, msg, links, "jev %.2f · %s" % (p, kind))
                except Exception as e:
                    log("jev error: %r" % e)
                if time.time() - last_report > 3600:
                    log("tg: last hour %d post(s) judged by jev, %d repost(s) and %d without link skipped, %d waiting" % (
                        STATS["jev"], STATS["duplicates"], STATS["nolink"], JEV_QUEUE.qsize()))
                    STATS.update(jev=0, duplicates=0, nolink=0)
                    last_report = time.time()

        async def deliver(chat, title, msg, links, why):
            src = "https://t.me/%s/%d" % (chat.username, msg.id) if getattr(chat, "username", None) else "https://t.me/c/%d/%d" % (chat.id, msg.id)
            log("tg: %s — %s — %s" % (title, why, msg.message[:80].replace("\n", " ")))
            meta = "🔧 <b>%s</b> (%s)\n<a href=\"%s\">Beitrag</a>" % (html.escape(title), html.escape(why), src)
            # One message: the post's photo, why it matched, its text and links.
            try:
                photo = await msg.download_media(file=bytes) if msg.photo else None
            except Exception as e:
                photo = log("photo download failed: %r" % e)
            await asyncio.to_thread(notify, "%s\n\n%s\n\n%s" % (meta, html.escape(msg.message[:300]),
                "\n".join(html.escape(l[:150]) for l in links[:3])), photo)

        async def log_groups():
            """Shows which of your groups TG_GROUPS matched, so a wrong ID or name shows up in the log."""
            if not GROUPS:
                return log("telegram: watching every group and channel")
            found, unmatched = [], set(GROUPS)
            async for d in TG.iter_dialogs():
                if d.is_user:
                    continue
                c = d.entity
                keys = {(getattr(c, "username", "") or "").lower(), str(c.id), "-%d" % c.id, "-100%d" % c.id}
                hit = [g for g in GROUPS if g in keys or g in (d.name or "").lower()]
                if hit:
                    found.append("%s (%s)" % (d.name, d.id))
                unmatched -= set(hit)
            log("telegram: watching " + (", ".join(found) or "nothing"))
            if unmatched:
                log("telegram: no group of yours matches %s — check TG_GROUPS" % ", ".join(sorted(unmatched)))

        def run(coro):
            return asyncio.run_coroutine_threadsafe(coro, LOOP).result(120)

        async def tg_start():
            await TG.connect()
            if await TG.is_user_authorized():
                me = await TG.get_me()
                log("telegram: listening as %s" % (me.username or me.first_name))
                await log_groups()
            else:
                log("telegram: not logged in, open the app page to log in")

        # ---------- web page ----------
        FORM = "<form method=post action=/%s><input name=%s %s required> <button>%s</button></form>"

        class Page(http.server.BaseHTTPRequestHandler):
            def reply(self, body, code=200):
                self.send_response(code)
                if code == 303:
                    self.send_header("Location", "/")
                else:
                    self.send_header("Content-Type", "text/html; charset=utf-8")
                self.end_headers()
                if body:
                    self.wfile.write(body.encode())

            def do_GET(self):
                if self.path == "/run":
                    threading.Thread(target=check_retoura).start()
                    return self.reply("", 303)
                if not TG:
                    tg = "Telegram groups: off (set TG_API_ID and TG_API_HASH)."
                elif run(TG.is_user_authorized()):
                    tg = "Telegram groups: logged in."
                elif "hash" not in LOGIN:
                    tg = "Telegram login, step 1 of 2:" + FORM % ("phone", "phone", "placeholder='+49…'", "Send code")
                elif LOGIN.get("password"):
                    tg = "Two-step password:" + FORM % ("password", "password", "type=password", "Log in")
                else:
                    tg = "Code from your Telegram app:" + FORM % ("code", "code", "inputmode=numeric", "Log in")
                lines = "\n".join(html.escape(l) for l in reversed(LOG)) or "Nothing yet."
                self.reply("<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width'>"
                           "<title>Deal Alerts</title><body style='font-family:system-ui;margin:16px'><h1>Deal Alerts</h1>"
                           "<pre>%s</pre><p>Change these by messaging the bot. <a href=/run>Check retoura now</a></p><p>%s</p>"
                           "<pre style='white-space:pre-wrap'>%s</pre>" % (html.escape(settings()), tg, lines))

            def do_POST(self):
                form = urllib.parse.parse_qs(self.rfile.read(int(self.headers["Content-Length"])).decode())
                val = form.get(self.path.strip("/"), [""])[0].strip()
                try:
                    if self.path == "/phone":
                        LOGIN.clear()
                        LOGIN.update(phone=val, hash=run(TG.send_code_request(val)).phone_code_hash)
                    elif self.path == "/code":
                        try:
                            run(TG.sign_in(LOGIN["phone"], val, phone_code_hash=LOGIN["hash"]))
                        except errors.SessionPasswordNeededError:
                            LOGIN["password"] = True
                    elif self.path == "/password":
                        run(TG.sign_in(password=val))
                    if run(TG.is_user_authorized()):
                        LOGIN.clear()
                        log("telegram: logged in")
                except Exception as e:
                    LOGIN.clear()
                    log("telegram login failed: %r" % e)
                self.reply("", 303)

            def log_message(self, *args):
                pass

        async def main():
            global LOOP
            LOOP = asyncio.get_running_loop()
            threading.Thread(target=http.server.ThreadingHTTPServer(("", 8080), Page).serve_forever, daemon=True).start()
            if BOT:
                threading.Thread(target=bot_loop, daemon=True).start()
            if TG:
                TG.add_event_handler(on_message, events.NewMessage(incoming=True))
                asyncio.create_task(jev_worker())
                await tg_start()
            await retoura_loop()

        asyncio.run(main())
