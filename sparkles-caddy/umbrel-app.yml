manifestVersion: "2.0"
id: sparkles-caddy
storage:
  dataRoot: data
environment:
  - name: DUCKDNS_SUBDOMAIN
    services:
      - caddy
    default: "homednx"
    note: DuckDNS parent subdomain. The wildcard certificate is issued for *.SUBDOMAIN.duckdns.org and AIOStreams is served at aio.SUBDOMAIN.duckdns.org.
  - name: AIOSTREAMS_SUBDOMAIN
    services:
      - caddy
    default: "aio"
    note: Child subdomain that serves AIOStreams. The full hostname is this value plus the DuckDNS parent subdomain, for example aio.homednx.duckdns.org.
  - name: DUCKDNS_TOKEN
    services:
      - caddy
    default: ""
    note: DuckDNS API token from https://www.duckdns.org. Caddy uses it to answer the DNS-01 challenge that issues the certificate.
  - name: CADDY_PORT
    services:
      - caddy
    default: "40444"
    note: Host port that publishes the HTTPS site. umbrelOS already uses 80 and 443, so this defaults to 40444. Match it in your LAN exposure.
  - name: CADDY_UPSTREAM
    services:
      - caddy
    default: "http://sparkles-aiostreams_aiostreams_1:3000"
    note: Address Caddy proxies requests to. Defaults to the installed AIOStreams app.
category: networking
name: Caddy
version: "2.15.0"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/caddy.png
tagline: Reverse proxy in front of AIOStreams
description: >-
  Caddy reverse-proxies requests to AIOStreams and serves them over HTTPS with
  a publicly trusted Let's Encrypt certificate, so you can reach AIOStreams at
  your own DuckDNS hostname.

  Set your DuckDNS parent subdomain, the child subdomain for AIOStreams and
  the DuckDNS API token in the app's environment settings. The certificate is
  issued with the DNS-01 challenge, so no inbound router port and no public
  DNS record are needed.

  Point the DuckDNS A record at this device's LAN address for LAN-only
  access, and open the published port on your LAN. The HTTPS site listens on
  host port 40444, because umbrelOS already occupies the host ports 80 and
  443.

  AIOStreams stays reachable through its own app proxy at the same time.
developer: Caddy
website: https://caddyserver.com
dependencies:
  - sparkles-aiostreams
repo: https://github.com/caddyserver/caddy
support: https://github.com/caddyserver/caddy/issues
port: 4001
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Sparkles
submission: https://github.com/pstens/umbrel-custom-store
releaseNotes: >-
  AIOStreams is now served over LAN HTTPS at aio.<parent>.duckdns.org with
  the publicly trusted Let's Encrypt wildcard certificate. Point the DuckDNS
  record at this device's LAN IP and set the AIOStreams BASE_URL to
  https://aio.<parent>.duckdns.org:40444.

  The self-signed local site, the /caddy-ca.crt download and the
  CADDY_LOCAL_HOST setting are gone. The Caddyfile is now a static file that
  reads the app settings from the environment.
