version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparkles-caddy_caddy_1
      APP_PORT: 80

  caddy:
    image: serfriz/caddy-duckdns:2.11.9@sha256:91722d22cedad751f9030df06bbd5d46d213d00f6bc167b2cebbdf8067bdae57
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      AIOSTREAMS_SUBDOMAIN: ${AIOSTREAMS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      CADDY_UPSTREAM: ${CADDY_UPSTREAM:-http://sparkles-aiostreams_aiostreams_1:3000}
    ports:
      # umbrelOS 2.0 already binds the host ports 80 and 443 for its own
      # dashboard, so the HTTPS entry point uses a high host port. Point your
      # LAN exposure at this port.
      - "${CADDY_PORT:-40444}:443"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
