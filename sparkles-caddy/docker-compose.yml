version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparkles-caddy_caddy_1
      APP_PORT: 80

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      CADDY_UPSTREAM: ${CADDY_UPSTREAM:-http://sparkles-aiostreams_aiostreams_1:3000}
      CADDY_ADDRESS: ${CADDY_ADDRESS:-http://}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
