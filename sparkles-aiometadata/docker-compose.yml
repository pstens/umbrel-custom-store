  redis:
    image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
    restart: on-failure
    # AIOMetadata needs Redis 8+ (HSETEX).
    # ponytail: fixed 512 MB cap; AIOMetadata sets an LFU eviction policy on boot.
    command: redis-server --appendonly yes --save 3600 1 --maxmemory 512mb
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
