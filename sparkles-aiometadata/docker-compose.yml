version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparkles-aiometadata_aiometadata_1
      APP_PORT: 3232

  # Named "aiometadata" so the app proxy and Caddy, which address
  # sparkles-aiometadata_aiometadata_1:3232, reach the filter in front of the
  # server without any change on their side.
  aiometadata:
    image: ghcr.io/cedya77/aiometadata:3.8.3@sha256:8a24bd90711e42a817baa20594cba3e08bbd340d859c6c5c9222be6f5f3eafd8
    restart: on-failure
    init: true
    entrypoint: ["node", "-e"]
    command:
      # Every $ is doubled so Compose leaves it alone.
      - |
        // Proxies AIOMetadata. Catalogs outside GENRE_CATALOG_IDS get a single
        // "Alle" genre instead of their full list, so Jellyfin apps like UHF show
        // one tile per catalog plus one per genre of the kept catalogs.
        const up = new URL(process.env.UPSTREAM);
        const client = require(up.protocol === 'https:' ? 'https' : 'http');
        const keep = new Set((process.env.GENRE_CATALOG_IDS || '').split(',').map((s) => s.trim()).filter(Boolean));
        const ALL = 'Alle';

        function strip(body) {
          try {
            const m = JSON.parse(body);
            for (const c of m.catalogs || []) {
              if (keep.has(c.id)) continue;
              // A required genre is how the catalog is browsed at all, so it stays.
              c.extra = (c.extra || []).map((e) => (e.name === 'genre' && !e.isRequired ? { name: 'genre', options: [ALL], isRequired: false } : e));
            }
            return JSON.stringify(m);
          } catch {
            return body;
          }
        }

        // "genre=Alle" stands for the whole catalog, so it never reaches AIOMetadata.
        function unalias(url) {
          const m = url.match(/^(.*\/catalog\/[^/]+\/[^/]+)\/([^/?]+)\.json(\?.*)?$$/);
          if (!m) return url;
          const extras = m[2].split('&').filter((p) => decodeURIComponent(p) !== `genre=$${ALL}`);
          if (extras.length === m[2].split('&').length) return url;
          return `$${m[1]}$${extras.length ? `/$${extras.join('&')}` : ''}.json$${m[3] || ''}`;
        }

        require('http').createServer((req, res) => {
          const manifest = req.url.split('?')[0].endsWith('/manifest.json');
          const headers = { ...req.headers, host: up.host };
          if (manifest) delete headers['accept-encoding'];
          const fwd = client.request({ protocol: up.protocol, hostname: up.hostname, port: up.port, path: unalias(req.url), method: req.method, headers }, (u) => {
            if (!manifest || u.statusCode !== 200) {
              res.writeHead(u.statusCode, u.headers);
              return u.pipe(res);
            }
            let body = '';
            u.setEncoding('utf8');
            u.on('data', (d) => (body += d));
            u.on('end', () => {
              const h = { ...u.headers };
              delete h['content-length'];
              delete h['transfer-encoding'];
              res.writeHead(200, h);
              res.end(strip(body));
            });
          });
          fwd.on('error', (e) => {
            res.writeHead(502);
            res.end(String(e));
          });
          req.pipe(fwd);
        }).listen(Number(process.env.PORT || 3232));
    depends_on:
      - server
    environment:
      UPSTREAM: http://sparkles-aiometadata_server_1:3232
      GENRE_CATALOG_IDS: ${GENRE_CATALOG_IDS-tmdb.discover.movie.de_popular.sparkles,tmdb.discover.series.de_popular.sparkles}

  server:
    image: ghcr.io/cedya77/aiometadata:3.8.3@sha256:8a24bd90711e42a817baa20594cba3e08bbd340d859c6c5c9222be6f5f3eafd8
    restart: on-failure
    stop_grace_period: 1m
    init: true
    # Every setting below is passed through, empty or not. Unset the empty
    # ones so AIOMetadata falls back to its own defaults instead of parsing "".
    entrypoint:
      - /bin/sh
      - -c
      - for v in $$(env | sed -n 's/^\([A-Z][A-Z0-9_]*\)=$$/\1/p'); do unset "$$v"; done; exec /usr/local/bin/entrypoint.sh
    depends_on:
      - redis
    environment:
      PORT: "3232"
      NODE_ENV: production
      DATABASE_URI: sqlite://addon/data/db.sqlite
      REDIS_URL: redis://sparkles-aiometadata_redis_1:6379
      MOVIELENS_CRED_KEY: ${APP_SPARKLES_AIOMETADATA_MOVIELENS_CRED_KEY}
      HOST_NAME: ${HOST_NAME:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
