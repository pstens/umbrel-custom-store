version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparkles-aiostreams_aiostreams_1
      APP_PORT: 3000

  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.38.1@sha256:1b90bc2fda70f365dff2ce98fc311a24708cca9841efe09aefe309cd4da1fb2c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: "3000"
      BASE_URL: ${BASE_URL:-http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}}
      SECRET_KEY: ${APP_SPARKLES_AIOSTREAMS_SECRET_KEY}
      DATABASE_URI: sqlite://./data/db.sqlite
      AIOSTREAMS_AUTH: ${AIOSTREAMS_AUTH:-}
      AIOSTREAMS_AUTH_PERMISSIONS: ${AIOSTREAMS_AUTH_PERMISSIONS:-}
      AIOSTREAMS_AUTH_REQUIRED: ${AIOSTREAMS_AUTH_REQUIRED:-false}
      REQUEST_HEADER_OVERRIDES: ${REQUEST_HEADER_OVERRIDES:-}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
